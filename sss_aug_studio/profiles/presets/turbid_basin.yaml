name: Highly turbid environment
description: >
  Suspended sediment: strong excess attenuation, low contrast, filled
  shadows, dense volume-reverberation speckle and water-column noise.
instances:
- family: radiometric
  label: strong attenuation
  instance_id: turb_radio01
  enabled: true
  probability: 1.0
  strength: 1.0
  params: {absorption_residual_db_per_m: 0.12, spread_residual_db_per_decade: -2.0, gain_offset_db: -1.5, altitude_factor: 1.0}
- family: shadow
  label: filled shadows
  instance_id: turb_shadow01
  enabled: true
  probability: 0.9
  strength: 1.0
  params: {floor_level: 0.12, floor_blend: 0.7, softness_m: 0.25, length_altitude_factor: 1.0, confidence_gate: 0.35}
- family: speckle
  label: volume reverberation
  instance_id: turb_speck01
  enabled: true
  probability: 1.0
  strength: 1.0
  params: {distribution: k, looks: 2.0, k_shape_nu: 4.0, texture_corr_m: 0.3}
- family: multipath
  label: water-column noise
  instance_id: turb_multi01
  enabled: true
  probability: 0.8
  strength: 1.0
  params: {surface_ghost_enabled: true, surface_ghost_gain_db: -10.0, wall_enabled: false, nadir_noise_level: 0.08}
