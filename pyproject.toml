[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sss-aug-studio"
version = "0.4.0"
description = "Physics-Informed Side-Scan Sonar Augmentation Studio - a scientific framework for physically plausible SSS dataset augmentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "USV-SSS Adaptive Survey Project" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
equations = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "pytest-cov", "ruff>=0.6"]

[project.scripts]
sss-aug-studio = "sss_aug_studio.app.main:main"
sss-aug-generate = "sss_aug_studio.generation.cli:main"

[tool.setuptools.packages.find]
include = ["sss_aug_studio*"]

[tool.setuptools.package-data]
sss_aug_studio = [
    "documentation/encyclopedia/*.md",
    "documentation/*.bib",
    "profiles/presets/*.yaml",
    "gui/*.qss",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gui: requires PySide6; the test module sets QT_QPA_PLATFORM=offscreen itself.",
]

[tool.ruff]
target-version = "py310"          # pyproject requires-python
line-length = 120                 # governs `ruff format` only; E501 is not in the default rule set
extend-exclude = [".venv", ".venv-nogui", ".repro_gate"]

[tool.ruff.lint]
# The rule selection is ruff's own default set and is deliberately NOT
# re-declared here: spelling out `select` would freeze a snapshot of it and
# silently drop future rules. The tool version is pinned in
# [project.optional-dependencies].dev instead, so the gate is reproducible.
# This mirrors the rationale in BlueBoat-MCS/ruff.toml.
#
# The baseline below is enumerated rather than a loosened config. Every entry
# is a whole-codebase restyling that rewrites annotations, import order or
# `__all__` ordering across every module; none of them catches a defect. The
# rules that do -- F (pyflakes), RUF013, PERF, BLE, EXE -- are all enabled and
# the tree is clean against them.
ignore = [
    # Annotation modernisation: `Optional[X]` -> `X | None`, `typing.Dict` ->
    # `dict`, unquoting forward refs. 92 sites. These are Pydantic v2 models
    # whose annotations are evaluated at runtime, and the four rules together
    # would rewrite nearly every signature in the package for no defect
    # caught. Adopt as one deliberate commit if the codebase is ever
    # modernised; not as a side effect of adding a lint gate.
    "UP006",
    "UP007",
    "UP035",
    "UP037",
    "UP045",
    # isort. The house layout is stdlib / third-party / local with a blank
    # line between, which the source already follows; the 18 hits are
    # intra-block alphabetisation only.
    "I001",
    # `__all__` ordering. It is grouped by meaning here (core data model
    # before pipeline before registry), which reads better than alphabetical
    # and is what the docs reference.
    "RUF022",
    # unnecessary-cast-to-int on the explicit `int(...)` casts in the pixel /
    # bin index paths. Every one is correct as written and the casts document
    # that an array index is intended. Judged valueless for this codebase as a
    # whole, matching the same project-wide ignore in BlueBoat-MCS/ruff.toml.
    "RUF046",
]
