name: River
description: >
  Narrow shallow channel: strong altitude coupling, current-driven speed
  variation, bank echoes on both sides, moderate turbidity attenuation.
instances:
- family: slant_geometry
  label: shallow altitude swings
  instance_id: river_slant01
  enabled: true
  probability: 1.0
  strength: 1.0
  params: {altitude_offset_m: 0.2, altitude_drift_m: 0.3, altitude_noise_m: 0.15, altitude_noise_corr_m: 3.0}
- family: platform_motion
  label: current push
  instance_id: river_motion01
  enabled: true
  probability: 1.0
  strength: 1.0
  params: {speed_std_frac: 0.2, speed_corr_m: 6.0, yaw_std_deg: 3.0, roll_amp_deg: 1.5}
- family: multipath
  label: bank echoes
  instance_id: river_multi01
  enabled: true
  probability: 0.8
  strength: 1.0
  params: {wall_enabled: true, wall_distance_m: 8.0, wall_distance_wander_m: 3.0, wall_gain_db: 6.0, wall_side: both, surface_ghost_enabled: false}
- family: radiometric
  label: turbidity attenuation
  instance_id: river_radio01
  enabled: true
  probability: 0.9
  strength: 1.0
  params: {absorption_residual_db_per_m: 0.06, spread_residual_db_per_decade: 3.0, altitude_factor: 0.85}
- family: speckle
  label: silt speckle
  instance_id: river_speck01
  enabled: true
  probability: 1.0
  strength: 1.0
  params: {distribution: k, looks: 2.5, k_shape_nu: 6.0, texture_corr_m: 0.4}
